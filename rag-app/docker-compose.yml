version: "3.9"

# ---------------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------------
networks:
  rag_net:
    driver: bridge

# ---------------------------------------------------------------------------
# Volumes
# ---------------------------------------------------------------------------
volumes:
  faiss_data:     # persists FAISS index + BM25 corpus across restarts
  upload_data:    # persists uploaded raw files

# ---------------------------------------------------------------------------
# Services
# ---------------------------------------------------------------------------
services:

  # ──────────────────────────────────────────────
  # Backend  (FastAPI + LangChain RAG)
  # ──────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: rag-backend:latest
    container_name: rag-backend
    restart: unless-stopped
    env_file: .env                  # load all secrets from root .env
    environment:
      # Override paths to container-local volumes
      UPLOAD_DIR: /app/uploads
      FAISS_INDEX_PATH: /app/faiss_index
      # Force structured JSON logging in container
      ENVIRONMENT: production
    volumes:
      - faiss_data:/app/faiss_index
      - upload_data:/app/uploads
    ports:
      - "8000:8000"                 # expose for direct API access / debugging
    networks:
      - rag_net
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ──────────────────────────────────────────────
  # Frontend  (Next.js)
  # ──────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Point the Next.js API client at the Nginx reverse proxy path
        NEXT_PUBLIC_API_URL: ""     # empty → same-origin via Nginx
    image: rag-frontend:latest
    container_name: rag-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
    ports:
      - "3000:3000"                 # expose for direct access / debugging
    networks:
      - rag_net
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ──────────────────────────────────────────────
  # Nginx  (reverse proxy — single public port :80)
  # ──────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: rag-nginx
    restart: unless-stopped
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    networks:
      - rag_net
    depends_on:
      - backend
      - frontend

# ---------------------------------------------------------------------------
# Development override
#   Run with:  docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# ---------------------------------------------------------------------------
# See docker-compose.dev.yml for hot-reload mounts.
